<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRa Boat Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    font-family:Arial, Helvetica, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

#map{
    width:100%;
    height:500px;
    border:2px solid #333;
    border-radius:10px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0px 2px 6px rgba(0,0,0,.2);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table th{
    background:#1976D2;
    color:white;
    padding:10px;
}

table td{
    padding:8px;
    text-align:center;
    border:1px solid #ddd;
}

button{
    background:#2196F3;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1565C0;
}

.info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}

.info div{
    background:#eeeeee;
    padding:10px;
    border-radius:5px;
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<h2>Dashboard Pelacak Pompong</h2>

<div class="card">
<div class="info">

<div>
Latitude<br>
<span id="lat">0</span>
</div>

<div>
Longitude<br>
<span id="lon">0</span>
</div>

<div>
Speed<br>
<span id="speed">0</span> km/h
</div>

<div>
Roll<br>
<span id="roll">0</span>°
</div>

<div>
Pitch<br>
<span id="pitch">0</span>°
</div>

<div>
Status<br>
<span id="status">-</span>
</div>

<div>
RSSI<br>
<span id="rssi">0</span> dBm
</div>

<div>
Satellite<br>
<span id="sat">0</span>
</div>

</div>
</div>

<div id="map"></div>

<div style="margin-bottom:20px;">
<a href="/download">
<button>
📥 Download GPS Log CSV
</button>
</a>
</div>

<div class="card">
<h3>Riwayat Perjalanan</h3>

<table id="history">
<thead>
<tr>
<th>Date</th>
<th>Time</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Speed</th>
<th>Roll</th>
<th>Pitch</th>
<th>Satellite</th>
<th>RSSI</th>
<th>Status</th>
</tr>
</thead>

<tbody>
</tbody>
</table>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
